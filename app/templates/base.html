<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}⚔️ Warrior Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
    <style>
        /* ── Base ── */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #1a1d23; color: #e0e6f0; font-family: 'Segoe UI', sans-serif; }
        .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }

        /* ── Header ── */
        .dashboard-header { text-align: center; padding: 2rem 0 1rem; border-bottom: 2px solid #3a4050; margin-bottom: 1.5rem; }
        .dashboard-header h1 {
            font-family: 'Merriweather', Georgia, serif;
            font-size: 2.2rem; font-weight: 900; letter-spacing: 2px;
            -webkit-text-stroke: 2px #008b8b;
            color: #ffffff;
            paint-order: stroke fill;
        }
        .header-emoji {
            font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
            -webkit-text-stroke: 0; font-size: 2rem; vertical-align: middle;
        }
        .tagline { color: #a8b2c1; margin: 0.5rem 0; font-style: italic; }
        .header-actions { margin-top: 0.75rem; }
        .header-actions a { color: #00e5ff; text-decoration: none; font-size: 0.9rem; margin: 0 0.5rem; }

        /* ── Flash ── */
        .flash { padding: 0.75rem 1rem; margin: 0.5rem 0; border-radius: 8px; border-left: 3px solid; }
        .flash-success { background: rgba(0,229,255,0.1); border-color: #00e5ff; color: #00e5ff; }
        .flash-error   { background: rgba(255,83,112,0.1); border-color: #ff5370; color: #ff5370; }

        /* ── Section titles ── */
        .section-title { font-size: 1.1rem; font-weight: 700; color: #00e5ff; letter-spacing: 2px; margin-bottom: 1rem; }

        /* ── Cards ── */
        .card { background: #2d3340; border: 1px solid #3a4050; border-radius: 12px; padding: 1.25rem; }

        /* ── Grid helpers ── */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 1rem; }
        .grid-5 { display: grid; grid-template-columns: repeat(5,1fr); gap: 0.75rem; }

        /* ── Stat cards ── */
        .stat-card { background: #2d3340; border: 1px solid #3a4050; border-radius: 12px; padding: 1rem; }
        .stat-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
        .stat-header h3 { font-size: 0.85rem; letter-spacing: 1px; color: #a8b2c1; }
        .stat-icon { font-size: 1.2rem; }
        .stat-level { font-size: 1.1rem; font-weight: 700; color: #ffd700; }
        .stat-bar { background: #1a1d23; border-radius: 4px; height: 8px; margin: 0.4rem 0; overflow: hidden; }
        .stat-bar-fill { height: 100%; background: linear-gradient(90deg,#00e5ff,#7c4dff); border-radius: 4px; transition: width 0.3s; }
        .stat-xp { font-size: 0.75rem; color: #a8b2c1; }

        /* ── Character overview ── */
        .character-overview { margin-bottom: 1.5rem; }
        .main-stats { display: flex; gap: 2rem; align-items: center; margin-bottom: 1rem; }
        .info-item { display: flex; flex-direction: column; }
        .info-item .label { font-size: 0.75rem; color: #a8b2c1; }
        .info-item .value { font-size: 1.5rem; font-weight: 700; color: #ffd700; }

        /* ── Buttons ── */
        .btn { padding: 0.6rem 1.2rem; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg,#00e5ff,#7c4dff); color: #fff; }
        .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }
        .btn-secondary { background: #3a4050; color: #e0e6f0; }
        .btn-secondary:hover { background: #454d60; }
        .btn-success { background: #00c853; color: #fff; }
        .btn-danger  { background: #ff5370; color: #fff; }
        .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.8rem; }

        /* ── Nav Dropdown ── */
        .nav-bar { margin-bottom: 1.5rem; }
        .nav-dropdown { position: relative; display: inline-block; }
        .nav-toggle {
            display: flex; align-items: center; gap: 0.5rem;
            padding: 0.65rem 1.2rem; background: #2d3340;
            border: 2px solid #008b8b; border-radius: 10px;
            color: #00e5ff; cursor: pointer; font-size: 0.95rem; font-weight: 600;
            transition: all 0.2s;
        }
        .nav-toggle:hover { background: #343947; }
        .nav-toggle .arrow { font-size: 0.65rem; transition: transform 0.2s; display: inline-block; }
        .nav-toggle.open .arrow { transform: rotate(180deg); }
        .nav-menu {
            display: none; position: absolute; top: calc(100% + 6px); left: 0;
            background: #2d3340; border: 1px solid #3a4050; border-radius: 10px;
            min-width: 230px; z-index: 500; overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .nav-menu.open { display: block; }
        .nav-item {
            display: block; width: 100%; padding: 0.7rem 1.1rem;
            background: none; border: none; text-align: left;
            color: #a8b2c1; cursor: pointer; font-size: 0.9rem;
            transition: background 0.15s, color 0.15s; border-left: 3px solid transparent;
        }
        .nav-item:hover  { background: #343947; color: #e0e6f0; }
        .nav-item.active { background: rgba(0,229,255,0.1); color: #00e5ff; border-left-color: #00e5ff; }
        .nav-divider { height: 1px; background: #3a4050; margin: 0.25rem 0; }

        /* ── Tabs ── */
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        /* ── Modal ── */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; overflow-y: auto; padding: 2rem; }
        .modal.show { display: block; }
        .modal-content { max-width: 900px; margin: 0 auto; background: #2d3340; padding: 2rem; border-radius: 15px; border: 1px solid #3a4050; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 2px solid #3a4050; padding-bottom: 1rem; }
        .close-btn { background: none; border: none; color: #fff; font-size: 2rem; cursor: pointer; line-height: 1; }
        .close-btn:hover { color: #ff5370; }

        /* ── Form elements ── */
        .form-section { margin-bottom: 1.5rem; padding: 1.25rem; background: #1a1d23; border-radius: 10px; border: 2px solid #3a4050; }
        .form-section h3 { margin-bottom: 1rem; font-size: 0.95rem; }
        .activity-item { display: flex; align-items: center; padding: 0.6rem 0.75rem; background: #2d3340; border-radius: 8px; cursor: pointer; margin-bottom: 0.4rem; transition: background 0.2s; }
        .activity-item:hover { background: #343947; }
        .activity-item input[type=checkbox] { margin-right: 0.75rem; width: 16px; height: 16px; cursor: pointer; }
        .activity-item span { flex: 1; font-size: 0.9rem; }
        .activity-points { color: #00e5ff; font-weight: 700; font-size: 0.85rem; }
        .form-input { width: 100%; padding: 0.65rem; background: #1a1d23; border: 2px solid #3a4050; border-radius: 8px; color: #fff; font-size: 0.95rem; }
        .form-input:focus { outline: none; border-color: #00e5ff; }
        label.form-label { display: block; margin-bottom: 0.4rem; color: #a8b2c1; font-size: 0.85rem; font-weight: 600; }

        /* ── Streak cards ── */
        .streak-card { background: #2d3340; border: 1px solid #ff6b35; border-radius: 10px; padding: 1rem; text-align: center; }
        .streak-count { font-size: 1.8rem; font-weight: 700; color: #ff6b35; }
        .streak-multiplier { font-size: 0.8rem; color: #a8b2c1; }

        /* ── Log card ── */
        .log-card { background: #2d3340; border: 1px solid #3a4050; border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .log-points { color: #00e5ff; font-weight: 700; }
        .badge { background: rgba(124,77,255,0.2); color: #7c4dff; border: 1px solid #7c4dff; border-radius: 20px; padding: 0.2rem 0.6rem; font-size: 0.75rem; }

        /* ── Challenge card ── */
        .challenge-card { background: linear-gradient(135deg,rgba(255,107,53,0.15),rgba(255,83,112,0.1)); border: 2px solid #ff6b35; border-radius: 12px; padding: 1.25rem; }
        .challenge-card h3 { color: #ff6b35; margin-bottom: 0.5rem; }
        .challenge-points { font-size: 1.5rem; font-weight: 700; color: #ffd700; }

        /* ── Analytics ── */
        .analytics-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 1rem; margin-bottom: 1rem; }
        .analytics-stat { background: #2d3340; border: 1px solid #3a4050; border-radius: 10px; padding: 1rem; text-align: center; }
        .analytics-stat .big-number { font-size: 1.8rem; font-weight: 700; color: #00e5ff; }
        .analytics-stat .label { font-size: 0.75rem; color: #a8b2c1; margin-top: 0.25rem; }
        .activity-bar { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
        .activity-bar-label { width: 140px; font-size: 0.8rem; color: #a8b2c1; text-align: right; }
        .activity-bar-track { flex: 1; background: #1a1d23; border-radius: 4px; height: 10px; }
        .activity-bar-fill { height: 100%; background: #00e5ff; border-radius: 4px; }
        .activity-bar-count { font-size: 0.8rem; color: #ffd700; width: 30px; }

        /* ── Skill tree ── */
        .skill-item { background: #2d3340; border: 1px solid #3a4050; border-radius: 10px; padding: 1rem; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .skill-item.unlocked { border-color: #00c853; opacity: 0.7; }
        .skill-cost { color: #ffd700; font-weight: 700; font-size: 1rem; }

        /* ── Achievement ── */
        .achievement-card { background: #2d3340; border: 1px solid #3a4050; border-radius: 10px; padding: 0.75rem 1rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; }
        .achievement-card.earned { border-color: #ffd700; }
        .achievement-bonus { color: #ffd700; font-weight: 700; }

        /* ── Notes ── */
        .note-item { background: #2d3340; border-left: 3px solid #7c4dff; border-radius: 0 8px 8px 0; padding: 0.75rem; margin-bottom: 0.5rem; }
        .note-date { font-size: 0.75rem; color: #a8b2c1; margin-top: 0.25rem; }
        .plan-item { background: #2d3340; border-left: 3px solid #00c853; border-radius: 0 8px 8px 0; padding: 0.75rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }

        /* ── Budget ── */
        .budget-summary { display: flex; gap: 1rem; margin-bottom: 1rem; }
        .budget-box { flex: 1; background: #2d3340; border-radius: 10px; padding: 1rem; text-align: center; }
        .budget-box .amount { font-size: 1.5rem; font-weight: 700; }
        .income-color  { color: #00c853; }
        .expense-color { color: #ff5370; }
        .balance-color { color: #ffd700; }
        .transaction-item { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #3a4050; font-size: 0.85rem; }

        /* ── Prog skills ── */
        .prog-lang-card { background: #2d3340; border: 1px solid #3a4050; border-radius: 10px; padding: 1rem; }
        .prog-lang-level { font-size: 1.5rem; font-weight: 700; color: #7c4dff; }

        /* ── Nemesis ── */
        .nemesis-active { background: linear-gradient(135deg,rgba(255,83,112,0.15),rgba(255,107,53,0.1)); border: 2px solid #ff5370; border-radius: 12px; padding: 1.25rem; }
        .nemesis-gauge-track { background: #1a1d23; border-radius: 4px; height: 12px; margin: 0.5rem 0; }
        .nemesis-gauge-fill { height: 100%; background: linear-gradient(90deg,#ff6b35,#ff5370); border-radius: 4px; }

        /* ── Responsive ── */
        @media(max-width:768px) {
            .grid-5 { grid-template-columns: repeat(2,1fr); }
            .grid-3 { grid-template-columns: 1fr; }
            .analytics-grid { grid-template-columns: repeat(2,1fr); }
        }

        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body>
<div class="container">
    {% block content %}{% endblock %}
</div>

<script>
    function toggleNav() {
        const menu   = document.getElementById('nav-menu');
        const toggle = document.getElementById('nav-toggle');
        if (!menu || !toggle) return;
        menu.classList.toggle('open');
        toggle.classList.toggle('open');
    }

    document.addEventListener('click', function(e) {
        const dropdown = document.getElementById('nav-dropdown');
        if (dropdown && !dropdown.contains(e.target)) {
            const menu   = document.getElementById('nav-menu');
            const toggle = document.getElementById('nav-toggle');
            if (menu)   menu.classList.remove('open');
            if (toggle) toggle.classList.remove('open');
        }
    });

    function showTab(id, btn, label) {
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + id).classList.add('active');
        if (btn)   btn.classList.add('active');
        if (label) document.getElementById('nav-current-label').textContent = label;
        const menu   = document.getElementById('nav-menu');
        const toggle = document.getElementById('nav-toggle');
        if (menu)   menu.classList.remove('open');
        if (toggle) toggle.classList.remove('open');
    }

    function showModal(id) { document.getElementById(id).classList.add('show'); }
    function hideModal(id) { document.getElementById(id).classList.remove('show'); }

    document.querySelectorAll('.modal').forEach(modal => {
        modal.addEventListener('click', function(e) {
            if (e.target === this) hideModal(this.id);
        });
    });

    {% block extra_scripts %}{% endblock %}
</script>
</body>
</html>
