<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}⚔️ Warrior Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>{% block extra_styles %}{% endblock %}</style>
</head>
<body>
<div class="container">
 
    {% block content %}{% endblock %}
 
</div>
 
<script>
    /* ── Tab switching ── */
    function showTab(id, btn) {
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.nav-group-btn').forEach(b => b.classList.remove('has-active'));
 
        const pane = document.getElementById('tab-' + id);
        if (pane) pane.classList.add('active');
        if (btn) {
            btn.classList.add('active');
            const groupBtn = btn.closest('.nav-group')?.querySelector('.nav-group-btn');
            if (groupBtn) groupBtn.classList.add('has-active');
        }
        document.querySelectorAll('.nav-dropdown-panel').forEach(p => p.classList.remove('open'));
    }
 
    /* ── Modals ── */
    function showModal(id) { document.getElementById(id).classList.add('show'); }
    function hideModal(id) { document.getElementById(id).classList.remove('show'); }
 
    document.addEventListener('DOMContentLoaded', () => {
        /* Nav: click to open/close */
        document.querySelectorAll('.nav-group-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const panel = btn.nextElementSibling;
                const isOpen = panel.classList.contains('open');
                document.querySelectorAll('.nav-dropdown-panel').forEach(p => p.classList.remove('open'));
                if (!isOpen) panel.classList.add('open');
            });
        });
 
        /* Close on outside click */
        document.addEventListener('click', () => {
            document.querySelectorAll('.nav-dropdown-panel').forEach(p => p.classList.remove('open'));
        });
 
        /* Close modal on backdrop click */
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', e => { if (e.target === modal) hideModal(modal.id); });
        });
    });
 
    {% block extra_scripts %}{% endblock %}
</script>
</body>
</html>
