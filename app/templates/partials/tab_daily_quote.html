<div id="daily-quote-section" style="
    margin-top: 3rem;
    padding-top: 2rem;
    border-top: 1px solid var(--border);
">
    <p class="label" style="margin-bottom: 1.25rem;">Quote of the Day</p>
    <div style="
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 3px solid var(--amber);
        border-radius: var(--radius);
        padding: 1.75rem 2rem;
    ">
        <p id="quote-text" style="
            font-family: 'Instrument Serif', Georgia, serif;
            font-size: 1.2rem;
            font-weight: 400;
            color: var(--text);
            line-height: 1.7;
            margin-bottom: 0.75rem;
        "></p>
        <p id="quote-author" style="
            font-size: 0.75rem;
            color: var(--text-3);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        "></p>
    </div>
</div>

    // Pick quote based on day of year — changes every midnight, same for all users
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const dayOfYear = Math.floor((now - start) / 86400000);
    const quote = quotes[dayOfYear % quotes.length];
 
    document.getElementById('quote-text').textContent = '\u201C' + quote.text + '\u201D';
    document.getElementById('quote-author').textContent = '— ' + quote.author;
})();
</script>
