<div id="modal-profile" class="modal">
  <div class="modal-content" style="max-width:400px;">
      <div class="modal-header">
          <h2>Edit Username</h2>
          <button class="close-btn" onclick="hideModal('modal-profile')">×</button>
      </div>
      <form method="POST" action="{{ url_for('main.edit_username') }}">
          <input class="form-input" type="text" name="username" placeholder="New username" style="margin-bottom:1rem;">
          <button class="btn btn-primary" type="submit">Save</button>
      </form>
  </div>
</div>
