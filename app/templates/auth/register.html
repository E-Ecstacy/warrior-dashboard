<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui; background: #1a1d23; color: #eee; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .box { max-width: 400px; width: 100%; padding: 2.5rem; background: #2d3340; border-radius: 16px; border: 1px solid #3a4050; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        h1 { text-align: center; color: #00e5ff; margin-bottom: 2rem; font-size: 2rem; }
        .flash { padding: 1rem; margin-bottom: 1rem; background: rgba(255, 83, 112, 0.15); border-radius: 8px; color: #ff5370; border-left: 3px solid #ff5370; }
        input { width: 100%; padding: 0.9rem; margin: 0.6rem 0; background: #1a1d23; border: 2px solid #3a4050; border-radius: 8px; color: #eee; font-size: 1rem; transition: all 0.2s; }
        input:focus { outline: none; border-color: #00e5ff; box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.1); }
        button { width: 100%; padding: 1.1rem; margin-top: 1.2rem; background: #00e5ff; border: none; border-radius: 8px; color: #1a1d23; font-weight: 600; font-size: 1.05rem; cursor: pointer; transition: all 0.2s; }
        button:hover { background: #00d4dd; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0, 229, 255, 0.3); }
        .link { text-align: center; margin-top: 1.5rem; color: #a8b2c1; }
        a { color: #00e5ff; text-decoration: none; font-weight: 500; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="box">
        <h1>⚔️ Register</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required autofocus>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Create Account</button>
        </form>
        <p class="link">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
    </div>
</body>
</html>
